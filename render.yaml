services:
  - type: web
    name: telegram-file-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: BOT_TOKEN, sync: false }
      - { key: BASE_WEBHOOK_URL, sync: false }
      - { key: WEBHOOK_SECRET, sync: false }
      - { key: TURSO_DATABASE_URL, sync: false }
      - { key: TURSO_AUTH_TOKEN, sync: false }
      - { key: START_MESSAGE_ID, value: "0" }
      - { key: SUPER_ADMIN_ID, sync: false }
      - { key: PYTHON_VERSION, value: "3.12.3" }
